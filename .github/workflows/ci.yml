name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Copy & localisation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: String catalog is generated from Localization/*.json
        run: |
          python3 scripts/build_xcstrings.py
          git diff --exit-code InvestiQ/Resources/Localizable.xcstrings
      - name: Localisation completeness (ru/en/cs)
        run: python3 scripts/check_l10n.py
      - name: No manipulative copy
        run: python3 scripts/lint_copy.py

  linux:
    name: Package tests (Linux, Swift 6.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t investiq-linux:6.2 -f ci/Dockerfile.linux ci
      - name: swift test
        run: ./scripts/test-linux.sh test

  macos:
    name: macOS build & tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Package tests (macOS)
        working-directory: InvestiQKit
        run: swift test
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project InvestiQ.xcodeproj -scheme InvestiQ -configuration Debug \
            -destination 'platform=macOS' build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild -project InvestiQ.xcodeproj -scheme InvestiQ -configuration Debug \
            -destination 'platform=macOS' test 2>&1 | tee test.log | grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)|\*\* TEST" || true
          if ! grep -q "TEST SUCCEEDED" test.log; then
            echo "---- tail of test.log ----"
            tail -250 test.log
            echo "---- crash reports ----"
            ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null || true
            for report in ~/Library/Logs/DiagnosticReports/InvestiQ*; do
              [ -f "$report" ] && head -150 "$report"
            done
            exit 1
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
